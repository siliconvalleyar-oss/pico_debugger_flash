# OpenOCD config for Raspberry Pi Debug Probe (CMSIS-DAP) to program Pico
# Using rescue mode for initial connection
adapter driver cmsis-dap
adapter usb vid_pid 0x2e8a 0x000c
adapter speed 5000
transport select swd

# Use rescue mode to force connection
set CHIPNAME rp2040
set CPUTAPID 0x01002927

# Rescue DAP (instance-id 0xf) - can connect even if cores are running
dap create rp2040.rescue_dap -tap rp2040.cpu -dp-id 0x01002927 -instance-id 0xf -ignore-syspwrupack

# Core 0 DAP (instance-id 0)
dap create rp2040.dap0 -tap rp2040.cpu -dp-id 0x01002927 -instance-id 0

# Target core 0
target create rp2040.core0 cortex_m -dap rp2040.dap0 -coreid 0
rp2040.core0 cortex_m reset_config sysresetreq
rp2040.core0 configure -event reset-init { rp2xxx rom_api_call CX }

# Flash
flash bank rp2040.flash rp2xxx 0x10000000 0 0 0 rp2040.core0

init