# Rescue mode RP2040 via Raspberry Pi Debug Probe (CMSIS-DAP).
#
# Leccion 8.6 (docs/SKILL.md): la implementacion manual previa de este
# archivo (dap create -tap sin swd newdap) estaba rota con OpenOCD moderno
# ("-tap is invalid"). El modo rescue nativo ya vive en target/rp2040.cfg
# (swd newdap + rescue_dap instance-id 0xf + clear DBGPWRUPREQ -> reset del
# PSM y halt en bootrom); este archivo solo lo invoca.
#
# Uso:
#   openocd -s <scripts-openocd> -f debugprobe-openocd-rescue.cfg
# Cuando imprima "Now restart OpenOCD without RESCUE flag", reprogramar
# normalmente con debugprobe-openocd.cfg (o flash_nosudo_multi.sh).

adapter driver cmsis-dap
adapter usb vid_pid 0x2e8a 0x000c
adapter speed 1000
transport select swd

set RESCUE 1
source [find target/rp2040.cfg]
