# Test rescue mode connection
adapter driver cmsis-dap
adapter usb vid_pid 0x2e8a 0x000c
adapter speed 1000
transport select swd

swd newdap rp2040 cpu -expected-id 0x01002927

# Rescue DAP - can connect when normal DAP fails
dap create rp2040.rescue -tap rp2040.cpu -dp-id 0x01002927 -instance-id 0xf -ignore-syspwrupack

# Clear DBGPWRUPREQ to reset power state machine
rp2040.rescue dpreg 0x4 0x00000000

# Wait a bit
sleep 100

# Now create normal DAP
dap create rp2040.dap0 -tap rp2040.cpu -dp-id 0x01002927 -instance-id 0

target create rp2040.core0 cortex_m -dap rp2040.dap0 -coreid 0
rp2040.core0 cortex_m reset_config sysresetreq

init
halt
